# Evaluation set: plain-English question -> gold SQL.
# Scoring is *execution accuracy*: the agent's result set must match the gold result
# set (values compared with tolerance; column names ignored; row order ignored unless
# ordered: true). Tags let us report accuracy by difficulty.
- id: q01
  tags: [easy, aggregate]
  question: What was total revenue in 2025?
  sql: |
    SELECT ROUND(SUM(f.net_revenue), 2) AS revenue
    FROM fact_sales f JOIN dim_date d USING (date_key)
    WHERE d.year = 2025 AND NOT f.is_returned
- id: q02
  tags: [easy, aggregate]
  question: How many orders did we get in total?
  sql: SELECT COUNT(DISTINCT order_id) AS orders FROM fact_sales
- id: q03
  tags: [easy, dimension]
  question: How many stores do we have in each country?
  sql: SELECT country, COUNT(*) AS stores FROM dim_store GROUP BY country
- id: q04
  tags: [easy, aggregate]
  question: Revenue by product category for all time, highest first.
  ordered: true
  sql: |
    SELECT p.category, ROUND(SUM(f.net_revenue), 2) AS revenue
    FROM fact_sales f JOIN dim_product p USING (product_key)
    WHERE NOT f.is_returned
    GROUP BY p.category ORDER BY revenue DESC
- id: q05
  tags: [easy, aggregate]
  question: Revenue by sales channel in 2024.
  sql: |
    SELECT f.channel, ROUND(SUM(f.net_revenue), 2) AS revenue
    FROM fact_sales f JOIN dim_date d USING (date_key)
    WHERE d.year = 2024 AND NOT f.is_returned GROUP BY f.channel
- id: q06
  tags: [easy, dimension]
  question: How many customers are in each segment?
  sql: SELECT segment, COUNT(*) AS customers FROM dim_customer GROUP BY segment
- id: q07
  tags: [medium, topn]
  question: Top 5 cities by revenue in 2025.
  ordered: true
