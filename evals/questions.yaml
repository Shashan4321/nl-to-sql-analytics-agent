- id: q10
  tags: [medium, ratio]
  question: What is the gross margin percentage by category?
  sql: |
    SELECT p.category,
           ROUND((SUM(f.net_revenue) - SUM(f.cost)) / SUM(f.net_revenue) * 100, 2) AS margin_pct
    FROM fact_sales f JOIN dim_product p USING (product_key)
    WHERE NOT f.is_returned GROUP BY p.category
- id: q11
  tags: [medium, ratio]
  question: What was the average order value in 2024?
  sql: |
    SELECT ROUND(SUM(f.net_revenue) / COUNT(DISTINCT f.order_id), 2) AS aov
    FROM fact_sales f JOIN dim_date d USING (date_key)
    WHERE d.year = 2024 AND NOT f.is_returned
- id: q12
  tags: [medium, time]
