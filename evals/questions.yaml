- id: q13
  tags: [medium, returns]
  question: What percentage of order lines were returned?
  sql: SELECT ROUND(AVG(CASE WHEN is_returned THEN 1 ELSE 0 END) * 100, 2) AS return_rate_pct FROM fact_sales
