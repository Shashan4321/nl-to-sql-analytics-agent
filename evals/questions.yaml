- id: q30
  tags: [hard, growth]
  question: Month-over-month revenue change in percent for the last 6 months of 2025.
  ordered: true
  sql: |
    WITH m AS (
      SELECT d.month, SUM(f.net_revenue) AS revenue
      FROM fact_sales f JOIN dim_date d USING (date_key)
      WHERE d.year = 2025 AND NOT f.is_returned GROUP BY d.month),
    g AS (SELECT month, ROUND((revenue / LAG(revenue) OVER (ORDER BY month) - 1) * 100, 2) AS mom_pct FROM m)
    SELECT month, mom_pct FROM g WHERE month >= 7 ORDER BY month
- id: q31
  tags: [hard, customer]
  question: How many new customers signed up in each year?
  ordered: true
  sql: |
    SELECT EXTRACT(year FROM signup_date) AS signup_year, COUNT(*) AS customers
    FROM dim_customer GROUP BY 1 ORDER BY 1
- id: q32
  tags: [hard, pareto]
  question: How many products make up the top 80% of all-time revenue?
  sql: |
    WITH p AS (
      SELECT product_key, SUM(net_revenue) AS revenue FROM fact_sales
      WHERE NOT is_returned GROUP BY product_key),
    c AS (
      SELECT revenue, SUM(revenue) OVER (ORDER BY revenue DESC) / SUM(revenue) OVER () AS cum_share
      FROM p)
    SELECT COUNT(*) AS products FROM c WHERE cum_share - revenue / (SELECT SUM(revenue) FROM p) < 0.8
