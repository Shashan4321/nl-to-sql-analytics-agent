- id: q27
  tags: [hard, share]
  question: What share of 2025 revenue came from each segment, in percent?
  sql: |
    SELECT c.segment,
           ROUND(SUM(f.net_revenue) * 100 / SUM(SUM(f.net_revenue)) OVER (), 2) AS share_pct
    FROM fact_sales f JOIN dim_customer c USING (customer_key) JOIN dim_date d USING (date_key)
    WHERE d.year = 2025 AND NOT f.is_returned GROUP BY c.segment
- id: q28
