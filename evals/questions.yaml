- id: q20
  tags: [medium, topn]
  question: Which state had the highest revenue in 2025?
  sql: |
    SELECT s.state, ROUND(SUM(f.net_revenue), 2) AS revenue
    FROM fact_sales f JOIN dim_store s USING (store_key) JOIN dim_date d USING (date_key)
    WHERE d.year = 2025 AND NOT f.is_returned
    GROUP BY s.state ORDER BY revenue DESC LIMIT 1
- id: q21
  tags: [hard, growth]
  question: Year-over-year revenue growth percentage for each year.
  ordered: true
  sql: |
    WITH y AS (
      SELECT d.year, SUM(f.net_revenue) AS revenue
      FROM fact_sales f JOIN dim_date d USING (date_key)
      WHERE NOT f.is_returned GROUP BY d.year)
    SELECT year, ROUND(revenue, 2) AS revenue,
           ROUND((revenue / LAG(revenue) OVER (ORDER BY year) - 1) * 100, 2) AS yoy_pct
    FROM y ORDER BY year
- id: q22
  tags: [hard, growth]
  question: Which category grew fastest in revenue from 2024 to 2025?
  sql: |
    WITH c AS (
      SELECT p.category,
             SUM(CASE WHEN d.year = 2024 THEN f.net_revenue END) AS r24,
             SUM(CASE WHEN d.year = 2025 THEN f.net_revenue END) AS r25
      FROM fact_sales f JOIN dim_product p USING (product_key) JOIN dim_date d USING (date_key)
      WHERE NOT f.is_returned GROUP BY p.category)
    SELECT category, ROUND((r25 / r24 - 1) * 100, 2) AS growth_pct
    FROM c ORDER BY growth_pct DESC LIMIT 1
- id: q23
  tags: [hard, window]
  question: Running total of revenue by month in 2025.
  ordered: true
  sql: |
    WITH m AS (
      SELECT d.month, SUM(f.net_revenue) AS revenue
      FROM fact_sales f JOIN dim_date d USING (date_key)
      WHERE d.year = 2025 AND NOT f.is_returned GROUP BY d.month)
    SELECT month, ROUND(SUM(revenue) OVER (ORDER BY month), 2) AS running_revenue
    FROM m ORDER BY month
- id: q24
  tags: [hard, window]
  question: Top-selling product by revenue in each category.
  sql: |
    WITH r AS (
      SELECT p.category, p.product_name, SUM(f.net_revenue) AS revenue,
             ROW_NUMBER() OVER (PARTITION BY p.category ORDER BY SUM(f.net_revenue) DESC) AS rn
      FROM fact_sales f JOIN dim_product p USING (product_key)
      WHERE NOT f.is_returned GROUP BY p.category, p.product_name)
    SELECT category, product_name, ROUND(revenue, 2) AS revenue FROM r WHERE rn = 1
- id: q25
  tags: [hard, customer]
  question: How many customers placed more than 10 orders?
  sql: |
    SELECT COUNT(*) AS customers FROM (
      SELECT customer_key FROM fact_sales
      GROUP BY customer_key HAVING COUNT(DISTINCT order_id) > 10)
