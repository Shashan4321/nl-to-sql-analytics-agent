- id: q29
  tags: [hard, store]
  question: Average revenue per store by country in 2025.
  sql: |
    WITH s AS (
      SELECT st.country, st.store_key, SUM(f.net_revenue) AS revenue
      FROM fact_sales f JOIN dim_store st USING (store_key) JOIN dim_date d USING (date_key)
      WHERE d.year = 2025 AND NOT f.is_returned GROUP BY st.country, st.store_key)
